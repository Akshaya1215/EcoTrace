services:
  - type: web
    name: ecotrace-api
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: ecotrace
      - key: AI_PROVIDER
        value: demo
      - key: FRONTEND_URL
        sync: false
